<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepClose stills</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/engine.css">
<style>
  :root {
    --bg: #e3e7db; --surface: #f3f5ee; --ink: #1f2a22; --accent: #4d6b52; --line: rgba(31,42,34,0.12);
    --bezel: #1f2a22; --bezel-rim: rgba(255,255,255,0.08); --shadow: rgba(31,42,34,0.42);
    --ring-halo: rgba(77,107,82,0.18); --ring-glow: rgba(77,107,82,0.35);
  }
  html, body { overflow: visible; }
  .shot { position: relative; overflow: hidden; background: var(--bg); }
  .shot svg.geo { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<section class="shot" id="hero" data-w="2400" data-h="1500"></section>
<section class="shot" id="feature-1" data-w="1600" data-h="1200"></section>
<section class="shot" id="feature-2" data-w="1600" data-h="1200"></section>
<section class="shot" id="feature-3" data-w="1600" data-h="1200"></section>
<section class="shot" id="og" data-w="1200" data-h="630"></section>

<script src="../lib/engine.js"></script>
<script src="../lib/stills.js"></script>
<script>
const IMG = (n) => `../../public/images/keepclose-${n}.png`;
const P = (s, x, y, src, rings) => ({ sw: 360, sh: 800, s, x, y, src: IMG(src), rings });
const geo = (el, cx, cy, rs, extra = "") => {
  el.insertAdjacentHTML("afterbegin", `<svg class="geo" viewBox="0 0 ${el.dataset.w} ${el.dataset.h}">
    <defs><radialGradient id="g${el.id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f3f5ee" stop-opacity="0.95"/><stop offset="1" stop-color="#f3f5ee" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${rs[rs.length - 1] * 0.95}" fill="url(#g${el.id})"/>
    <g fill="none" stroke="#4d6b52">${rs.map((r, i) => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke-opacity="${0.16 - i * 0.03}" stroke-width="2" ${i === 1 ? 'stroke-dasharray="2 14"' : ""}/>`).join("")}</g>
    ${extra}</svg>`);
};
const SPOT = "rgba(31,42,34,0.20)";

// hero: three phones, centre raised
{ const s = document.getElementById("hero");
  geo(s, 1200, 750, [560, 760, 1000], `<g fill="#4d6b52" fill-opacity="0.35"><circle cx="1960" cy="750" r="9"/><circle cx="440" cy="750" r="9"/><circle cx="1200" cy="-10" r="8"/><circle cx="1200" cy="1510" r="8"/></g>`);
  Still.phone(s, P(1.32, 380, 236, "memory"));
  Still.phone(s, P(1.32, 1508, 236, "export"));
  Still.phone(s, P(1.5, 909, 129, "profile"));
}
// feature 1: how you're connected
{ const s = document.getElementById("feature-1");
  geo(s, 800, 600, [520, 700, 920]);
  Still.phone(s, P(2.0, 412, -248, "profile", [{ x: 18, y: 286, w: 324, h: 250, spot: true, dim: SPOT }]));
}
// feature 2: capture a memory (voice / photo + follow-up)
{ const s = document.getElementById("feature-2");
  geo(s, 800, 600, [520, 700, 920]);
  Still.phone(s, P(2.0, 412, -478, "memory", [
    { x: 16, y: 362, w: 328, h: 48, r: 12 },
    { x: 16, y: 618, w: 328, h: 80, r: 12 },
  ]));
}
// feature 3: selective export
{ const s = document.getElementById("feature-3");
  geo(s, 800, 600, [520, 700, 920]);
  Still.phone(s, P(2.0, 412, -428, "export", [{ x: 10, y: 312, w: 340, h: 408, r: 14, spot: true, dim: SPOT }]));
}
// og
{ const s = document.getElementById("og");
  geo(s, 980, 360, [300, 420, 560]);
  s.insertAdjacentHTML("beforeend", `<div style="position:absolute;left:84px;top:196px;width:560px">
    <div class="wordmark" style="font-size:118px">KeepClose</div>
    <div style="margin-top:22px;font-size:29px;line-height:1.38;font-weight:500;color:#3c4a40">People. Relationships.<br>The details worth remembering.</div></div>`);
  Still.phone(s, P(0.92, 800, 64, "profile"));
}
</script>
</body>
</html>
