<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tally stills</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/engine.css">
<style>
  :root {
    --bg: #121714; --surface: #1c241f; --ink: #eef3ef; --accent: #3d9a6c; --line: rgba(238,243,239,0.12);
    --ring: #3d9a6c; --ring-halo: rgba(61,154,108,0.3); --ring-glow: rgba(61,154,108,0.45);
  }
  html, body { overflow: visible; }
  .shot { position: relative; overflow: hidden; background: var(--bg); }
  .shot svg.geo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .appwin > img { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<section class="shot" id="hero" data-w="2400" data-h="1500"></section>
<section class="shot" id="feature-1" data-w="1600" data-h="1200"></section>
<section class="shot" id="feature-2" data-w="1600" data-h="1200"></section>
<section class="shot" id="feature-3" data-w="1600" data-h="1200"></section>
<section class="shot" id="og" data-w="1200" data-h="630"></section>

<script src="../lib/engine.js"></script>
<script src="../lib/stills.js"></script>
<script>
const IMG = (n) => `../../public/images/tally/tally-${n}.png`;
const WIN = (src, x, y, s, rings, o = {}) => ({ cls: "appwin", src: IMG(src), iw: 1440, ih: 900, w: 1440, h: 900, x, y, s, radius: 16, bg: "#f7f6f3", rings, ...o });
const geo = (el, cx, cy, rs, extra = "") => {
  el.insertAdjacentHTML("afterbegin", `<svg class="geo" viewBox="0 0 ${el.dataset.w} ${el.dataset.h}">
    <defs><radialGradient id="g${el.id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1d2a22"/><stop offset="1" stop-color="#1d2a22" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${rs[rs.length - 1]}" fill="url(#g${el.id})"/>
    <g fill="none" stroke="#3d9a6c">${rs.map((r, i) => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke-opacity="${0.1 - i * 0.02}" stroke-width="2" ${i === 1 ? 'stroke-dasharray="2 14"' : ""}/>`).join("")}</g>${extra}</svg>`);
};
const marks = (x, y, k = 1) => `<g stroke="#3d9a6c" stroke-opacity="0.16" stroke-width="${4 * k}" stroke-linecap="round"><path d="M${x} ${y}v${100 * k}M${x + 30 * k} ${y}v${100 * k}M${x + 60 * k} ${y}v${100 * k}M${x + 90 * k} ${y}v${100 * k}M${x - 16 * k} ${y + 84 * k}l${122 * k} ${-68 * k}"/></g>`;
const SPOT = "rgba(18,23,20,0.22)";

{ const s = document.getElementById("hero");
  geo(s, 1200, 750, [560, 780, 1020], marks(2080, 120) + marks(200, 1280));
  Still.card(s, WIN("tasks-board-dark", 960, 120, 0.92, [], { bg: "#1b1b1b" }));
  Still.card(s, WIN("today-light", 230, 360, 1.08));
  Still.card(s, { cls: "appwin", src: IMG("mini-timer-light"), iw: 342, ih: 98, w: 340, h: 96, cx: 1, cy: 1, x: 1560, y: 1180, s: 1.5, radius: 12, bg: "#f7f6f3" });
}
{ const s = document.getElementById("feature-1");
  geo(s, 800, 600, [520, 700, 920]);
  Still.card(s, WIN("command-palette-light", 800 - 720 * 1.9, 600 - 333 * 1.9, 1.9, [{ x: 428, y: 104, w: 584, h: 458, r: 14 }]));
}
{ const s = document.getElementById("feature-2");
  geo(s, 800, 600, [520, 700, 920]);
  // crop of the real habit-history panel only (the routine list above it is left out)
  Still.card(s, WIN("habits-light", (1600 - 1000 * 1.5) / 2, (1200 - 236 * 1.5) / 2, 1.5,
    [{ x: 778, y: 82, w: 34, h: 34, r: 17 }], { w: 1000, h: 236, cx: 224, cy: 360, radius: 14 }));
}
{ const s = document.getElementById("feature-3");
  geo(s, 800, 600, [520, 700, 920]);
  // crop of the real focus-timer panel, with the floating mini timer window beside it
  Still.card(s, WIN("today-light", 230, 170, 2.0, [{ x: 94, y: 40, w: 136, h: 136, r: 70 }], { w: 324, h: 262, cx: 980, cy: 450, radius: 16 }));
  Still.card(s, { cls: "appwin", src: IMG("mini-timer-light"), iw: 342, ih: 98, w: 340, h: 96, cx: 1, cy: 1, x: 760, y: 820, s: 2.0, radius: 12, bg: "#f7f6f3" });
}
{ const s = document.getElementById("og");
  geo(s, 1000, 320, [300, 420, 540], marks(110, 70, 0.5));
  s.insertAdjacentHTML("beforeend", `<div style="position:absolute;left:80px;top:200px;width:520px">
    <img src="../assets/tally-logo-dark.svg" alt="Tally" style="height:104px;width:auto;display:block">
    <div style="margin-top:20px;font-size:29px;line-height:1.38;font-weight:500;color:rgba(238,243,239,0.82)">Habits. Focus. Tasks. Reflection.<br>All on your own device.</div></div>`);
  Still.card(s, WIN("today-light", 640, 120, 0.62));
}
</script>
</body>
</html>
